[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ams-optimizer"
version = "0.2.0"
description = "Multi-Level DAG Digital Logic Optimizer & Synthesizer for Custom Analog & Mixed-Signal IC Blocks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ams-opt = "ams_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["ams_optimizer*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
