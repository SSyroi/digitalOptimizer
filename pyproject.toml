[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "espresso-mv-optimizer"
version = "1.0.0"
description = "Unified Multi-Output Berkeley Espresso-MV Digital Logic Optimizer & Synthesizer for AMS IC Design"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
espresso-opt = "espresso_mv_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["espresso_mv_optimizer*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
